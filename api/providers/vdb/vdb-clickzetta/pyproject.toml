[project]
name = "orqivium-vdb-clickzetta"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "clickzetta-connector-python==0.8.104",
]
description = "Orqivium vector store backend (orqivium-vdb-clickzetta)."

[project.entry-points."orqivium.vector_backends"]
clickzetta = "orqivium_vdb_clickzetta.clickzetta_vector:ClickzettaVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
