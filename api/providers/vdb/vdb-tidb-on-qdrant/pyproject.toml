[project]
name = "orqivium-vdb-tidb-on-qdrant"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "qdrant-client==1.18.0",
]
description = "Orqivium vector store backend (orqivium-vdb-tidb-on-qdrant)."

[project.entry-points."orqivium.vector_backends"]
tidb_on_qdrant = "orqivium_vdb_tidb_on_qdrant.tidb_on_qdrant_vector:TidbOnQdrantVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
