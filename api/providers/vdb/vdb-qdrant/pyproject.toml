[project]
name = "orqivium-vdb-qdrant"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "qdrant-client==1.18.0",
]
description = "Orqivium vector store backend (orqivium-vdb-qdrant)."

[project.entry-points."orqivium.vector_backends"]
qdrant = "orqivium_vdb_qdrant.qdrant_vector:QdrantVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
