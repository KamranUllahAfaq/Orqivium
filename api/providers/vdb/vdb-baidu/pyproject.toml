[project]
name = "orqivium-vdb-baidu"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]
dependencies = [
    "pymochow==2.4.0",
]
description = "Orqivium vector store backend (orqivium-vdb-baidu)."

[project.entry-points."orqivium.vector_backends"]
baidu = "orqivium_vdb_baidu.baidu_vector:BaiduVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
