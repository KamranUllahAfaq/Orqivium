[project]
name = "orqivium-vdb-lindorm"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "opensearch-py==3.2.0",
    "tenacity>=8.0.0,<9.0.0",
]
description = "Orqivium vector store backend (orqivium-vdb-lindorm)."

[project.entry-points."orqivium.vector_backends"]
lindorm = "orqivium_vdb_lindorm.lindorm_vector:LindormVectorStoreFactory"

[tool.setuptools.packages.find]
where = ["src"]
