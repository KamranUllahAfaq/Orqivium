[project]
name = "orqivium-vdb-opensearch"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "opensearch-py==3.2.0",
]
description = "Orqivium vector store backend (orqivium-vdb-opensearch)."

[project.entry-points."orqivium.vector_backends"]
opensearch = "orqivium_vdb_opensearch.opensearch_vector:OpenSearchVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
