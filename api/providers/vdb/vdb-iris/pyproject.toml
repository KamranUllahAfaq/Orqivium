[project]
name = "orqivium-vdb-iris"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "intersystems-irispython>=5.1.0,<6.0.0",
]
description = "Orqivium vector store backend (orqivium-vdb-iris)."

[project.entry-points."orqivium.vector_backends"]
iris = "orqivium_vdb_iris.iris_vector:IrisVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
