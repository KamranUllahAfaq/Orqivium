[project]
name = "orqivium-vdb-analyticdb"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]
dependencies = [
    "alibabacloud_gpdb20160503~=5.2.0",
    "alibabacloud_tea_openapi==0.4.5",
    "clickhouse-connect==0.15.1",
]
description = "Orqivium vector store backend (orqivium-vdb-analyticdb)."

[project.entry-points."orqivium.vector_backends"]
analyticdb = "orqivium_vdb_analyticdb.analyticdb_vector:AnalyticdbVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
