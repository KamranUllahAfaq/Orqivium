[project]
name = "orqivium-vdb-upstash"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "upstash-vector==0.8.0",
]
description = "Orqivium vector store backend (orqivium-vdb-upstash)."

[project.entry-points."orqivium.vector_backends"]
upstash = "orqivium_vdb_upstash.upstash_vector:UpstashVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
