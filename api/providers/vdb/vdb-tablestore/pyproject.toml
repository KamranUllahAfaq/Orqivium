[project]
name = "orqivium-vdb-tablestore"
version = "0.0.1"
authors = [{ name = "Kamran Ullah Afaq" }]
maintainers = [{ name = "Kamran Ullah Afaq" }]

dependencies = [
    "tablestore==6.4.8",
]
description = "Orqivium vector store backend (orqivium-vdb-tablestore)."

[project.entry-points."orqivium.vector_backends"]
tablestore = "orqivium_vdb_tablestore.tablestore_vector:TableStoreVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
